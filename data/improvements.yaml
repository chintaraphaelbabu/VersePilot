duplicate_reference:
  symptom: "end_verse concatenates with next number (Luke 18:18-10, Daniel 2:3-611, etc.)"
  mechanism: "ReferenceBuilder accumulates trailing digits into end_verse or chapter without sanity-checking against bounds"
  corpus_evidence:
    - "Luke 18:18-10 (sermon 1)"
    - "Daniel 2:3-611 (sermon 1)"
    - "Revelation 48:4-29 (sermon 1)"
    - "Daniel 18:2-22 (sermon 1)"
  fix_hint: "Add chapter/verse max bounds check in ReferenceBuilder before committing end_verse"
  priority: medium  # was low; promoted after root-cause analysis
  status: open

timeout_guard:
  symptom: "Single bible_search request took 229 seconds"
  mechanism: "No timeout guard on bible_search HTTP/SQL queries"
  corpus_evidence:
    - "unusually_long_processing: 229.14s (sermon 1)"
  fix_hint: "Abort bible_search requests exceeding 60s"
  priority: medium
  status: open

ordinal_chapter_parsing:
  symptom: "Chapter-in-words format not parsed (ఒకటవ అధ్యాయము = first chapter)"
  mechanism: "Telugu ordinal numbers not supported by normalizer or preprocessor"
  corpus_evidence:
    - "navigation_failures: ఒకటవ అధ్యాయము 13 నుంచి 16 వరకు"
  fix_hint: "Add Telugu ordinal mapping (ఒకటవ/రెండవ/మూడవ → 1/2/3) in normalizer preprocessor"
  priority: low
  status: open

telugu_range_expression:
  symptom: "Range expressions like '13 నుంచి 16' produce no reference"
  mechanism: "Telugu range syntax నుంచి (nundi = from) not recognized by parser"
  corpus_evidence:
    - "navigation_failures: 13 నుంచి 16 3 వచనాల్లో"
    - "builder_failures: multiple entries with standalone number tokens"
  fix_hint: "Recognize <num> నుంచి <num> patterns and convert to n-m range syntax"
  priority: low
  status: open

cross_utterance_reference_tracking:
  symptom: "Speaker mentions a reference earlier; verse-only mentions later produce no match"
  mechanism: "No cross-utterance reference context carried across utterances"
  corpus_evidence:
    - "~10 builder_failures entries have partial verse text without citation"
  fix_hint: "Carry previous reference context across utterances to resolve standalone verse/range mentions"
  priority: low
  status: open

dead_code_removal:
  symptom: "~223 lines of dead code across 6 files — never imported or unreachable"
  mechanism: "Accumulated during development; no pruning pass done"
  files:
    - "confidence.py:185 — entire file never imported anywhere"
    - "parser.py:116-135 — _fuzzy_score function, never called"
    - "normalizer.py:429-431 — TeluguNormalizer class, never used"
    - "sermon_context.py:95 — style_verse branch, dead"
    - "speech_engine.py:24-27 — ABC with one implementation"
  fix_hint: "Delete unreachable code; keep ABC if future implementations expected"
  priority: high  # trivial effort, immediate clarity
  status: open